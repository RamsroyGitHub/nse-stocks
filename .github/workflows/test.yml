name: Test NSE data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try to download NSE daily file
        run: |
          S="https"
          H1="nsearchives"
          H2="nseindia"
          W="www"
          for i in 0 1 2 3 4 5 6; do
            D=$(date -u -d "$i days ago" +%d%m%Y)
            URL="${S}://${H1}.${H2}.com/products/content/sec_bhavdata_full_${D}.csv"
            REF="${S}://${W}.${H2}.com/"
            CODE=$(curl -s -o nse.csv -w "%{http_code}" -A "Mozilla/5.0" -H "Referer: ${REF}" "$URL")
            echo "$D -> HTTP $CODE"
            if [ "$CODE" = "200" ] && [ "$(wc -l < nse.csv)" -gt 500 ]; then
              echo "SUCCESS rows: $(wc -l < nse.csv)"
              head -3 nse.csv
              exit 0
            fi
          done
          echo "FAILED"
          exit 1
