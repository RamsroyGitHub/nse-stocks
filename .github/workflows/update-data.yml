name: Update data
on:
  push:
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check files
        run: |
          ls -la
          ls -la scripts || echo "NO scripts folder found"
      - name: Build stock data
        run: node scripts/build-data.mjs
      - name: Save data to the repository
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@localhost"
          git add public/data
          git diff --cached --quiet || git commit -m "Update stock data"
          git push
